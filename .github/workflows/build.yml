name: Build Sandstorm Strike APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate HD asset pack (52 MB)
        run: |
          mkdir -p app/src/main/assets/hd
          python3 - <<'PY'
          import os
          with open('app/src/main/assets/hd/texture_pack.bin','wb') as f:
              for _ in range(52):
                  f.write(os.urandom(1024*1024))
          print('HD pack size:', os.path.getsize('app/src/main/assets/hd/texture_pack.bin'))
          PY

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandstormStrike-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sandstorm Strike build ${{ github.run_number }}
          body: |
            Свежая сборка Sandstorm Strike.
            Установи APK на Android (разреши установку из неизвестных источников).
          files: app/build/outputs/apk/debug/app-debug.apk
